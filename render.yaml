databases:
  - name: eravenda-db
    databaseName: eravenda
    user: eravenda
    plan: free

services:
  - type: web
    name: eravenda-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: eravenda-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SITE_URL
        value: https://eravenda-api.onrender.com
      - key: SUPPORT_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_FLYER_URL
        value: https://res.cloudinary.com/ni2pcrua/image/upload/v1789391753/EraVenda_Banner.jpg
      - key: NEWSLETTER_CRON_SECRET
        generateValue: true
      - key: COMMISSION_LAUNCH_START_DATE
        value: "2026-10-14"
      - key: COMMISSION_LAUNCH_DURATION_DAYS
        value: "90"
      - key: COMMISSION_LAUNCH_VENDOR_CAP
        value: "20"
      - key: SERVICE_COMMISSION_RATE
        value: "0.04"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
