databases:
  - name: eravenda-db
    databaseName: eravenda
    user: eravenda
    # Left unset on purpose: whichever plan is set in the Render Dashboard
    # stays as-is on every future Blueprint sync. Pin an explicit value here
    # (e.g. basic-1gb) only if you want this file to be the source of truth
    # for the plan too — see https://render.com/docs/blueprint-spec#database-fields
    # for the current instance-type names.

services:
  - type: web
    name: eravenda-api
    runtime: python
    # Left unset on purpose — see the database's `plan` comment above. Before
    # this file explicitly said `free`, which would silently downgrade the
    # live paid service back to free on the next Blueprint sync (e.g. a git
    # push), losing always-on hosting and undoing the upgrade.
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Lets Render confirm a new instance is actually serving before it retires
    # the old one — zero-downtime deploys, which only take effect on a paid
    # plan (a free instance has just the one instance regardless).
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: eravenda-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SITE_URL
        # Public address of the site (no trailing slash). Used for Paystack
        # payment callbacks, email links and the sitemap.
        value: https://eravenda.com
      - key: SUPPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_FLYER_URL
        value: https://res.cloudinary.com/ni2pcrua/image/upload/v1789391753/EraVenda_Banner.jpg
      - key: NEWSLETTER_CRON_SECRET
        generateValue: true
      - key: SERVICE_COMMISSION_RATE
        value: "0.04"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
