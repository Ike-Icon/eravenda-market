{% extends "base.html" %}
{% block title %}Reset your password — Eravenda Market{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="border border-slate-200 rounded-md p-8">
    <h1 class="font-head text-xl font-semibold mb-2">Forgot your password?</h1>
    <p class="text-sm text-slate-500 mb-4">Enter the email on your account and we'll send you a link to reset it.</p>

    <div id="formError" class="hidden text-sm text-red-600 bg-red-50 rounded-md p-3 mb-4"></div>
    <div id="formSuccess" class="hidden text-sm text-brand-700 bg-brand-50 rounded-md p-3 mb-4"></div>

    <form id="forgotForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-slate-300 rounded-md px-3 py-2">
      </div>
      <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-2 rounded-md transition-colors">Send reset link</button>
    </form>
    <p class="text-sm text-center text-slate-500 mt-4">Remembered it after all? <a href="/login" class="text-brand-600 font-semibold">Log in</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("formError");
    const okBox = document.getElementById("formSuccess");
    errBox.classList.add("hidden");
    okBox.classList.add("hidden");

    const email = new FormData(e.target).get("email");
    const btn = e.target.querySelector("button");
    btn.disabled = true;

    try {
      const data = await apiFetch("/auth/forgot-password", { method: "POST", body: { email }, auth: false });
      okBox.textContent = data.message;
      okBox.classList.remove("hidden");
      e.target.reset();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove("hidden");
    } finally {
      btn.disabled = false;
    }
  });
</script>
{% endblock %}
