{% extends "base.html" %}
{% block title %}Payment result — Eravenda Market{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 text-center">
  <div id="resultBox" class="border border-slate-200 rounded-md p-8">
    <div class="animate-pulse text-slate-500">Confirming your payment…</div>
    {# <div class="border border-slate-300 round-md p-9 text-slate-500 animate-pulse">Confirming your payment…</div> #}
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (!Auth.isLoggedIn()) {
    window.location.href = "/login?next=/payments/callback";
  }

  async function confirm() {
    const box = document.getElementById("resultBox");
    const reference = new URLSearchParams(window.location.search).get("reference")
      || new URLSearchParams(window.location.search).get("trxref");

    if (!reference) {
      box.innerHTML = `<p class="text-red-600">No payment reference was provided.</p>`;
      return;
    }

    // Service-booking payments use a distinct reference prefix (see
    // payments.py's initialize_service_payment) so this page can route them
    // to the booking tracker instead of the product-order history.
    const isServicePayment = reference.startsWith("ERVSVC-");
    // Seller plan / promotion payments (ERVSUB- / ERVPRO-) are confirmed by
    // routers/monetization.py and send the seller back to their growth page.
    const isSellerCharge = reference.startsWith("ERVSUB-") || reference.startsWith("ERVPRO-");

    try {
      if (isSellerCharge) {
        const result = await apiFetch(`/monetization/verify/${encodeURIComponent(reference)}`);
        const isPlan = result.kind === "subscription";
        if (result.status === "success") {
          box.innerHTML = `
            <div class="text-3xl mb-3">✅</div>
            <h1 class="font-head text-xl font-semibold mb-2">Payment successful</h1>
            <p class="text-slate-500 mb-4">${isPlan ? "Your seller plan is active. The lower commission applies to new orders from now." : "Your promotion is live. It runs for the number of weeks you paid for."}</p>
            <a href="/seller/growth.html" class="inline-block bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">Back to plan &amp; promotion</a>
          `;
        } else {
          box.innerHTML = `
            <div class="text-3xl mb-3">⚠️</div>
            <h1 class="font-head text-xl font-semibold mb-2">Payment not confirmed</h1>
            <p class="text-slate-500 mb-4">Paystack didn't confirm this payment as successful. No charge should have gone through. You can try again from your plan page.</p>
            <a href="/seller/growth.html" class="inline-block bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">Back to plan &amp; promotion</a>
          `;
        }
        return;
      }

      if (isServicePayment) {
        const result = await apiFetch(`/payments/service/verify/${encodeURIComponent(reference)}`);
        if (result.status === "success") {
          box.innerHTML = `
            <div class="text-3xl mb-3">✅</div>
            <h1 class="font-head text-xl font-semibold mb-2">Payment successful</h1>
            <p class="text-slate-500 mb-4">Your payment has been received. Eravenda will release it to the professional once the work is verified.</p>
            <a href="/services/bookings/${result.booking_id}" class="inline-block bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">View booking</a>
          `;
        } else {
          box.innerHTML = `
            <div class="text-3xl mb-3">⚠️</div>
            <h1 class="font-head text-xl font-semibold mb-2">Payment not confirmed</h1>
            <p class="text-slate-500 mb-4">Paystack didn't confirm this payment as successful. No charge should have gone through — you can try again from the booking page.</p>
            <a href="/services/bookings/${result.booking_id}" class="inline-block bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">Back to booking</a>
          `;
        }
        return;
      }

      const result = await apiFetch(`/payments/verify/${encodeURIComponent(reference)}`);
      if (result.status === "success") {
        box.innerHTML = `
          <div class="text-3xl mb-3">✅</div>
          <h1 class="font-head text-xl font-semibold mb-2">Payment successful</h1>
          <p class="text-slate-500 mb-4">Your order is now marked as paid and the seller has been notified. We've emailed you a receipt, and you can download it here too.</p>
          <div class="flex flex-col sm:flex-row gap-2 justify-center">
            <button type="button" data-receipt-download="${result.order_id}" class="inline-flex items-center justify-center gap-2 border border-brand-300 text-brand-700 hover:bg-brand-50 font-semibold px-5 py-2 rounded-md transition-colors"><i class="fas fa-file-arrow-down" aria-hidden="true"></i>Download receipt</button>
            <a href="/orders.html" class="inline-block bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">View your orders</a>
          </div>
        `;
      } else {
        box.innerHTML = `
          <div class="text-3xl mb-3">⚠️</div>
          <h1 class="font-head text-xl font-semibold mb-2">Payment not confirmed</h1>
          <p class="text-slate-500 mb-4">Paystack didn't confirm this payment as successful. No charge should have gone through — you can try again from your orders page.</p>
          <a href="/orders.html" class="inline-block bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">Back to orders</a>
        `;
      }
    } catch (err) {
      const backHref = isSellerCharge ? "/seller/growth.html" : (isServicePayment ? "/services/bookings" : "/orders.html");
      box.innerHTML = `<p class="text-red-600">${err.message}</p><a href="${backHref}" class="text-brand-600 font-semibold hover:underline mt-3 inline-block">Go back</a>`;
    }
  }

  confirm();
</script>
{% endblock %}
