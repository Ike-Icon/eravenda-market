{% extends "base.html" %}
{% block title %}Set a new password — Eravenda Market{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="border border-slate-200 rounded-md p-8">
    <h1 class="font-head text-xl font-semibold mb-4">Set a new password</h1>

    <div id="formError" class="hidden text-sm text-red-600 bg-red-50 rounded-md p-3 mb-4"></div>
    <div id="formSuccess" class="hidden text-sm text-brand-700 bg-brand-50 rounded-md p-3 mb-4"></div>

    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">New password</label>
        <input type="password" name="new_password" minlength="6" required class="w-full border border-slate-300 rounded-md px-3 py-2">
      </div>
      <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-2 rounded-md transition-colors">Reset password</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const token = new URLSearchParams(window.location.search).get("token");
  const errBox = document.getElementById("formError");

  if (!token) {
    errBox.textContent = "This reset link is missing its token. Request a new one from the forgot password page.";
    errBox.classList.remove("hidden");
    document.getElementById("resetForm").classList.add("hidden");
  }

  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const okBox = document.getElementById("formSuccess");
    errBox.classList.add("hidden");
    okBox.classList.add("hidden");

    const new_password = new FormData(e.target).get("new_password");
    const btn = e.target.querySelector("button");
    btn.disabled = true;

    try {
      const data = await apiFetch("/auth/reset-password", { method: "POST", body: { token, new_password }, auth: false });
      okBox.textContent = data.message;
      okBox.classList.remove("hidden");
      e.target.reset();
      setTimeout(() => { window.location.href = "/login"; }, 1800);
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove("hidden");
      btn.disabled = false;
    }
  });
</script>
{% endblock %}
