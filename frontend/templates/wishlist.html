{% extends "base.html" %}
{% block title %}Wishlist — Eravenda Market{% endblock %}
{% block content %}
<section class="max-w-6xl mx-auto px-4 py-8">
  <h1 class="font-head text-2xl font-semibold mb-2">My wishlist</h1>
  <div id="guestWishlistBanner" class="hidden mb-4 bg-brand-50 border border-brand-200 rounded-md p-3 text-sm text-brand-800">
    <a href="/login?next=/wishlist" class="font-semibold underline">Log in</a> or <a href="/register" class="font-semibold underline">create an account</a> to save your wishlist permanently.
  </div>
  <div id="wishlist" class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <p class="text-slate-500 col-span-full">Loading…</p>
  </div>
</section>
{% endblock %}
{% block scripts %}<script>
const money = n => `₵${Number(n).toFixed(2)}`;

function renderGuestWishlist() {
  const el = document.getElementById("wishlist");
  document.getElementById("guestWishlistBanner").classList.remove("hidden");
  const ids = GuestWishlist.getItems();

  if (!ids.length) {
    el.innerHTML = '<p class="text-slate-500 col-span-full py-12 text-center">Your wishlist is empty. <a href="/products" class="text-brand-600 font-semibold">Browse products</a> and save your favourites.</p>';
    return;
  }

  el.innerHTML = ids.map(id => `
    <article class="border rounded-md overflow-hidden" data-wish-id="${id}">
      <a href="/product/${id}"><div class="aspect-square bg-slate-100 flex items-center justify-center text-2xl text-slate-300">🛍️</div></a>
      <div class="p-3">
        <p class="text-sm text-slate-500">Product saved in your local wishlist.</p>
        <button class="mt-2 text-xs text-red-600 hover:underline" data-guest-wish-remove="${id}">Remove</button>
      </div>
    </article>`).join("");

  el.querySelectorAll("[data-guest-wish-remove]").forEach(btn => {
    btn.addEventListener("click", () => {
      GuestWishlist.remove(btn.dataset.guestWishRemove);
      renderGuestWishlist();
    });
  });
}

async function loadWishlist() {
  const el = document.getElementById("wishlist");
  try {
    const items = await apiFetch("/wishlist");
    if (!items.length) {
      el.innerHTML = '<p class="text-slate-500 col-span-full py-12 text-center">Your wishlist is empty. <a href="/products" class="text-brand-600 font-semibold">Browse products</a> and save your favourites.</p>';
      return;
    }
    el.innerHTML = items.map(({product: p}) => {
      const img = (p.images || [])[0];
      const badges = (p.badge_keys || []).slice(0, 2).map(b => `<span class="inline-flex items-center gap-1 text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-brand-50 text-brand-700"><i data-lucide="badge-check" class="w-2.5 h-2.5"></i>${String(b).replaceAll('-', ' ')}</span>`).join('');
      return `<article data-product-card data-product-url="/product/${p.id}" tabindex="0" role="link" class="border rounded-md overflow-hidden cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand-500">
        <div class="aspect-square bg-slate-100">${img ? `<img class="w-full h-full object-cover" src="${img.image_url}" alt="">` : '<div class="w-full h-full flex items-center justify-center text-2xl text-slate-300">🛍️</div>'}</div>
        <div class="p-3 text-sm font-semibold">${p.name}<div class="text-xs text-amber-600 mt-1">★ ${Number(p.average_rating || 0).toFixed(1)} <span class="text-slate-400">(${p.review_count || 0})</span></div><div class="flex flex-wrap gap-1 mt-1">${badges}</div><div class="mt-1">${money(p.discount_price || p.price)}</div></div>
        <button class="w-full p-2 text-sm text-red-600" data-id="${p.id}">Remove</button>
      </article>`;
    }).join("");
    if (window.lucide) lucide.createIcons();
    if (typeof initProductCards === "function") initProductCards();
    el.querySelectorAll("button[data-id]").forEach(b => b.onclick = async () => {
      await apiFetch(`/wishlist/${b.dataset.id}`, {method: "DELETE"});
      location.reload();
    });
  } catch (e) {
    el.innerHTML = `<p class="text-red-600 col-span-full">Couldn't load your wishlist: ${e.message}</p>`;
  }
}

if (Auth.isLoggedIn()) {
  loadWishlist();
} else {
  renderGuestWishlist();
}
</script>{% endblock %}
