{% extends "base.html" %}
{% block title %}Contact Us — Eravenda Market{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-12">
  <h1 class="font-head text-3xl font-semibold mb-2">Contact us</h1>
  <p class="text-slate-500 mb-6">Questions, order issues, or seller applications — send us a message and we'll get back to you.</p>

  <div id="formError" class="hidden text-sm text-red-600 bg-red-50 rounded-md p-3 mb-4"></div>
  <div id="formSuccess" class="hidden text-sm text-brand-700 bg-brand-50 rounded-md p-3 mb-4"></div>

  <form id="contactForm" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Your name</label>
      <input name="name" required class="w-full border border-slate-300 rounded-md px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" required class="w-full border border-slate-300 rounded-md px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Subject</label>
      <input name="subject" placeholder="e.g. Order question" class="w-full border border-slate-300 rounded-md px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Message</label>
      <textarea name="message" required rows="5" class="w-full border border-slate-300 rounded-md px-3 py-2"></textarea>
    </div>
    <button type="submit" class="bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">Send message</button>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("formError");
    const okBox = document.getElementById("formSuccess");
    errBox.classList.add("hidden");
    okBox.classList.add("hidden");

    const payload = Object.fromEntries(new FormData(e.target).entries());
    const btn = e.target.querySelector("button");
    btn.disabled = true;

    try {
      const data = await apiFetch("/contact", { method: "POST", body: payload, auth: false });
      okBox.textContent = data.message;
      okBox.classList.remove("hidden");
      e.target.reset();
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove("hidden");
    } finally {
      btn.disabled = false;
    }
  });
</script>
{% endblock %}
