<!--
  Generic image lightbox — click/tap a product thumbnail anywhere on the
  site to see it full-size, for places that only show a small thumbnail
  with no way to view it larger (e.g. cart line items).

  product.html already has its own, richer image viewer (hover-pan,
  drag-to-pan, thumbnail switching) scoped to that page — this is a
  simpler, site-wide fallback for everywhere else, exposed as a single
  global function so any page's script can call it:

      openImageLightbox(imageUrl, altText)
-->
<div id="imageLightbox" class="fixed inset-0 z-[70] hidden items-center justify-center bg-slate-950/80 p-4" role="dialog" aria-modal="true" aria-label="Image preview">
  <button type="button" class="absolute inset-0 cursor-default" data-lightbox-close aria-label="Close image preview"></button>
  <div class="relative max-w-3xl w-full flex items-center justify-center">
    <img id="imageLightboxImg" src="" alt="" class="max-h-[85vh] max-w-full rounded-md object-contain shadow-2xl relative">
    <button type="button" data-lightbox-close class="absolute -right-2 -top-2 w-9 h-9 rounded-full bg-white text-slate-800 font-bold shadow" aria-label="Close image preview">&times;</button>
  </div>
</div>

<script>
(function () {
  var modal = document.getElementById("imageLightbox");
  var img = document.getElementById("imageLightboxImg");
  if (!modal || !img) return;

  window.openImageLightbox = function (src, alt) {
    if (!src) return;
    img.src = src;
    img.alt = alt || "";
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    document.body.classList.add("overflow-hidden");
  };

  function close() {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
    document.body.classList.remove("overflow-hidden");
    img.src = "";
  }

  modal.querySelectorAll("[data-lightbox-close]").forEach(function (btn) {
    btn.addEventListener("click", close);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !modal.classList.contains("hidden")) close();
  });
})();
</script>
