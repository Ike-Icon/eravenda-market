{% extends "base.html" %}
{% block title %}Log in — Eravenda Market{% endblock %}

{% block extra_head %}
<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="border border-slate-200 rounded-md p-8">
    <h1 class="font-head text-xl font-semibold mb-4">Welcome back</h1>
    <div id="loginError" class="hidden text-sm text-red-600 bg-red-50 rounded-md p-3 mb-4"></div>

    <div class="space-y-2 mb-2">
      <div id="googleSignInDiv" class="flex justify-center"></div>
      <button id="appleSignInBtn" type="button" class="w-full flex items-center justify-center gap-2 border border-slate-300 rounded-md py-2 font-semibold text-sm hover:bg-slate-50 transition-colors">
        <i class="fa-brands fa-apple text-base"></i>
        Continue with Apple
      </button>
    </div>
    <div class="flex items-center gap-3 my-4">
      <div class="flex-1 h-px bg-slate-200"></div>
      <span class="text-xs text-slate-400 uppercase tracking-wide">or</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-slate-300 rounded-md px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" required class="w-full border border-slate-300 rounded-md px-3 py-2">
        <a href="/forgot-password" class="text-xs text-brand-600 hover:underline mt-1 inline-block">Forgot your password?</a>
      </div>
      <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-white font-semibold py-2 rounded-md transition-colors">Log in</button>
    </form>
    <p class="text-sm text-center text-slate-500 mt-4">New to Eravenda Market? <a href="/register" class="text-brand-600 font-semibold">Create an account</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const loginNext = new URLSearchParams(window.location.search).get("next") || "/";
  initSocialAuth({ errorBoxId: "loginError", redirectTo: loginNext });

  if (new URLSearchParams(window.location.search).get("reason") === "session_expired") {
    const errBox = document.getElementById("loginError");
    errBox.textContent = "Your session expired. Please log in again.";
    errBox.classList.remove("hidden");
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errBox = document.getElementById("loginError");
    errBox.classList.add("hidden");
    const fd = new FormData(e.target);

    try {
      const res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ username: fd.get("email"), password: fd.get("password") }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Login failed");
      Auth.setSession(data.access_token, data.user);
      await mergeGuestData();
      window.location.href = loginNext;
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove("hidden");
    }
  });
</script>
{% endblock %}
