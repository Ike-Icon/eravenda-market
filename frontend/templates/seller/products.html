{% extends "base.html" %}
{% block title %}My products — Eravenda Market{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8 grid md:grid-cols-[200px_1fr] gap-8">
  {% set active = "products" %}
  {% include "components/seller-nav.html" with context %}

  <div>
    <div class="flex items-center justify-between mb-4">
      <h1 class="font-head text-2xl font-semibold">My products</h1>
      <a href="/seller/add-product.html" class="bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">+ Add product</a>
    </div>
    <div id="productsList" class="min-w-0"><p class="text-slate-500">Loading…</p></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (!Auth.isLoggedIn()) {
    window.location.href = "/login?next=/seller/products.html";
  }

  function money(n) { return `₵${Number(n).toFixed(2)}`; }
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  const STATUS_STYLES = {
    pending: "bg-amber-50 text-amber-700",
    approved: "bg-brand-50 text-brand-700",
    rejected: "bg-red-50 text-red-700",
    out_of_stock: "bg-slate-100 text-slate-600",
  };
  function badgeHtml(status) {
    const classes = STATUS_STYLES[status] || "bg-slate-100 text-slate-600";
    return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full capitalize ${classes}">${status.replace("_", " ")}</span>`;
  }

  async function load() {
    const el = document.getElementById("productsList");
    try {
      const products = await apiFetch("/products/store/mine");
      if (!products.length) {
        el.innerHTML = `<div class="text-center py-16 text-slate-500">You haven't added any products yet. <a href="/seller/add-product.html" class="text-brand-600 font-semibold">Add your first one</a>.</div>`;
        return;
      }
      const rows = products.map(p => {
        const lowStock = Number(p.stock_quantity) < 5;
        const name = escapeHtml(p.name);
        const price = money(p.discount_price ?? p.price);
        const stock = `${p.stock_quantity}${lowStock ? ` <span class="ml-1 inline-block text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Low stock</span>` : ""}`;
        const actions = `<div class="flex flex-wrap items-center gap-3"><a href="/seller/edit-product.html?id=${p.id}" class="inline-flex min-h-10 items-center justify-center rounded-md bg-brand-50 px-3 py-2 text-xs font-semibold text-brand-700 hover:bg-brand-100">Edit</a><button type="button" class="inline-flex min-h-10 items-center justify-center rounded-md bg-red-50 px-3 py-2 text-xs font-semibold text-red-700 hover:bg-red-100" data-delete="${p.id}">Delete</button></div>`;
        return { name, price, stock, status: badgeHtml(p.status), actions };
      });

      el.innerHTML = `
        <div class="hidden md:block overflow-x-auto rounded-lg border border-slate-200">
          <table class="w-full min-w-[620px] text-sm">
            <thead class="bg-slate-50 text-left text-xs text-slate-500 uppercase">
              <tr><th class="p-3">Name</th><th class="p-3">Price</th><th class="p-3">Stock</th><th class="p-3">Status</th><th class="p-3 text-right">Actions</th></tr>
            </thead>
            <tbody>
              ${rows.map(r => `<tr class="border-t border-slate-100 align-middle"><td class="p-3 font-medium">${r.name}</td><td class="p-3">${r.price}</td><td class="p-3">${r.stock}</td><td class="p-3">${r.status}</td><td class="p-3 text-right">${r.actions}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="grid gap-3 md:hidden">
          ${rows.map(r => `<article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm"><div class="flex items-start justify-between gap-3"><h2 class="min-w-0 break-words text-sm font-semibold text-slate-900">${r.name}</h2>${r.status}</div><dl class="mt-3 grid grid-cols-2 gap-3 text-sm"><div><dt class="text-xs text-slate-500">Price</dt><dd class="mt-1 font-semibold">${r.price}</dd></div><div><dt class="text-xs text-slate-500">Stock</dt><dd class="mt-1">${r.stock}</dd></div></dl><div class="mt-4 border-t border-slate-100 pt-3">${r.actions}</div></article>`).join("")}
        </div>
      `;

      el.querySelectorAll("[data-delete]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("Remove this product from your store?")) return;
          try {
            await apiFetch(`/products/${btn.dataset.delete}`, { method: "DELETE" });
            load();
          } catch (err) { alert(err.message); }
        });
      });
    } catch (err) {
      el.innerHTML = `<p class="text-red-600">Couldn't load your products: ${escapeHtml(err.message)}</p>`;
    }
  }

  load();
</script>
{% endblock %}
