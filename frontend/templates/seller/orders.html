{% extends "base.html" %}
{% block title %}Incoming orders — Eravenda Market{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8 grid md:grid-cols-[200px_1fr] gap-8">
  {% set active = "orders" %}
  {% include "components/seller-nav.html" with context %}

  <div class="min-w-0">
    <h1 class="font-head text-2xl font-semibold mb-4">Incoming orders</h1>
    <div id="ordersList" class="space-y-4"><p class="text-slate-500">Loading…</p></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (!Auth.isLoggedIn()) {
    window.location.href = "/login?next=/seller/orders.html";
  }

  const STATUS_OPTIONS = ["pending", "paid", "processing", "shipped", "delivered", "cancelled", "refunded"];

  function money(n) { return `₵${Number(n).toFixed(2)}`; }
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  async function load() {
    const el = document.getElementById("ordersList");
    try {
      const orders = await apiFetch("/orders/store/mine");
      if (!orders.length) {
        el.innerHTML = `<div class="text-center py-16 text-slate-500">No orders yet. Once a buyer checks out, orders show up here.</div>`;
        return;
      }
      el.innerHTML = orders.map(o => `
        <div class="border border-slate-200 rounded-md p-5">
          <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
            <div>
              <strong>${escapeHtml(o.order_number)}</strong>
              <span class="text-xs text-slate-500 ml-1">· ${new Date(o.created_at).toLocaleDateString()}</span>
            </div>
            <select data-order="${o.id}" class="status-select border border-slate-300 rounded-md px-2 py-1 text-sm">
              ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
            </select>
          </div>
          <details class="border border-slate-200 rounded-lg p-3 mb-4 bg-slate-50">
            <summary class="cursor-pointer text-sm font-semibold text-slate-700">Add processing and delivery information</summary>
            <div class="grid sm:grid-cols-2 gap-3 mt-3">
              <label class="text-xs text-slate-600">Shipping carrier<input data-carrier="${o.id}" value="${escapeHtml(o.shipping_carrier || "")}" placeholder="e.g. DHL, Ghana Post, local delivery" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mt-1"></label>
              <label class="text-xs text-slate-600">Tracking number<input data-tracking="${o.id}" value="${escapeHtml(o.tracking_number || "")}" placeholder="Enter tracking or delivery reference" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mt-1"></label>
              <label class="text-xs text-slate-600">Estimated delivery<input type="datetime-local" data-estimated="${o.id}" value="${o.estimated_delivery ? new Date(o.estimated_delivery).toISOString().slice(0, 16) : ""}" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mt-1"></label>
              <label class="text-xs text-slate-600 sm:col-span-2">Customer update<textarea data-note="${o.id}" rows="3" maxlength="2000" placeholder="Tell the customer what is happening with this order..." class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mt-1">${escapeHtml(o.seller_note || "")}</textarea></label>
            </div>
            <button type="button" data-update-order="${o.id}" class="mt-3 bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-md text-sm font-semibold">Save order update</button>
          </details>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <tbody>
                ${o.items.map(i => `
                  <tr class="border-t border-slate-100">
                    <td class="py-2">${escapeHtml(i.product_name)}</td>
                    <td class="py-2">x${i.quantity}</td>
                    <td class="py-2 text-right">${money(i.line_total)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
          <div class="flex flex-wrap justify-between gap-2 font-semibold border-t border-slate-200 pt-3 mt-1">
            <span>Total</span><span>${money(o.total_amount)}</span>
          </div>
          <div class="text-xs text-slate-500 mt-1">
            EraVenda commission: ${money(o.commission_amount)} · Estimated payout before Paystack/delivery split: ${money(o.subtotal - o.commission_amount)}
          </div>
        </div>
      `).join("");

      el.querySelectorAll("[data-update-order]").forEach(button => {
        button.addEventListener("click", async () => {
          const id = button.dataset.updateOrder;
          button.disabled = true;
          button.textContent = "Saving…";
          try {
            await apiFetch(`/orders/${id}/status`, { method: "PUT", body: {
              status: el.querySelector(`[data-order="${id}"]`).value,
              shipping_carrier: el.querySelector(`[data-carrier="${id}"]`).value.trim() || null,
              tracking_number: el.querySelector(`[data-tracking="${id}"]`).value.trim() || null,
              estimated_delivery: el.querySelector(`[data-estimated="${id}"]`).value || null,
              seller_note: el.querySelector(`[data-note="${id}"]`).value.trim() || null,
            } });
            button.textContent = "Saved";
            setTimeout(() => { button.disabled = false; button.textContent = "Save order update"; }, 1200);
          } catch (err) {
            alert(err.message);
            button.disabled = false;
            button.textContent = "Save order update";
          }
        });
      });
    } catch (err) {
      el.innerHTML = `<p class="text-red-600">Couldn't load orders: ${escapeHtml(err.message)}</p>`;
    }
  }

  load();
</script>
{% endblock %}
