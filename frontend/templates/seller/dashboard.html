{% extends "base.html" %}
{% block title %}Seller dashboard — Eravenda Market{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8 grid md:grid-cols-[200px_1fr] gap-8">
  {% set active = "overview" %}
  {% include "components/seller-nav.html" with context %}

  <div id="dashContent" class="min-w-0">
    <p class="text-slate-500">Loading your store…</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (!Auth.isLoggedIn()) {
    window.location.href = "/login?next=/seller/dashboard.html";
  }

  function money(n) { return `₵${Number(n).toFixed(2)}`; }
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  const STATUS_STYLES = {
    pending: "bg-amber-50 text-amber-700",
    approved: "bg-brand-50 text-brand-700",
    rejected: "bg-red-50 text-red-700",
    suspended: "bg-red-50 text-red-700",
    paid: "bg-brand-50 text-brand-700",
    processing: "bg-blue-50 text-blue-700",
    shipped: "bg-blue-50 text-blue-700",
    delivered: "bg-brand-50 text-brand-700",
    cancelled: "bg-red-50 text-red-700",
  };
  function badgeHtml(status) {
    const classes = STATUS_STYLES[status] || "bg-slate-100 text-slate-600";
    return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full capitalize ${classes}">${status}</span>`;
  }

  async function load() {
    try {
      const store = await apiFetch("/stores/me");
      renderStoreDashboard(store);
    } catch (err) {
      // No store yet — show the setup form instead.
      renderSetupForm();
    }
  }

  function renderSetupForm() {
    const user = Auth.getUser() || {};
    document.getElementById("dashContent").innerHTML = `
      <h1 class="font-head text-2xl font-semibold mb-2">Open your store</h1>
      <p class="text-slate-500 mb-4">Tell us about your business. An admin reviews every new store before it goes live, usually within a day.</p>
      <div class="border border-slate-200 rounded-md p-6 max-w-lg">
        <div id="storeError" class="hidden text-sm text-red-600 bg-red-50 rounded-md p-3 mb-4"></div>
        <form id="storeForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Store name</label>
            <input name="store_name" required class="w-full border border-slate-300 rounded-md px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Description</label>
            <textarea name="description" placeholder="What do you sell?" class="w-full border border-slate-300 rounded-md px-3 py-2"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium mb-1">Region</label>
              <select name="region" required data-region-select data-location-group="store" data-selected="${escapeHtml(user.region || "")}" class="w-full border border-slate-300 rounded-md px-3 py-2"><option value="">Select region</option></select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">City / District</label>
              <select name="city" required data-city-select data-location-group="store" data-selected="${escapeHtml(user.city || "")}" disabled class="w-full border border-slate-300 rounded-md px-3 py-2"><option value="">Select city / district</option></select>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Sub-town / neighbourhood</label>
            <input name="sub_town" required value="${escapeHtml(user.sub_town || "")}" placeholder="e.g. Fiapre" class="w-full border border-slate-300 rounded-md px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Business registration number (optional)</label>
            <input name="business_registration_number" class="w-full border border-slate-300 rounded-md px-3 py-2">
          </div>
          <div class="border-t border-slate-200 pt-4 mt-2">
            <details class="group">
              <summary class="cursor-pointer text-sm font-semibold text-slate-700 hover:text-brand-700">Read the Seller Terms &amp; Conditions</summary>
              <div class="mt-3 bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4 text-sm text-slate-700 leading-relaxed max-h-64 overflow-y-auto">

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">1. Seller Commission</h3>
                  <p>EraVenda's launch rate is a flat <strong>5%</strong> on every product, across all categories — the same rate for every seller, kept simple and fair while EraVenda is new to the public. The commission is deducted automatically before your payout. This is a launch-time rate and may be revised later (including moving to category-specific rates), with at least 30 days' notice, and no category rate will ever exceed <strong>10%</strong>.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">2. What you take home</h3>
                  <p>For a GHS 100 sale at the 5% flat rate: GHS 5.00 EraVenda commission plus an estimated GHS 2.25 Paystack fee leaves approximately <strong>GHS 92.75</strong> before any delivery-fee split. Paystack fees are estimates and may vary by payment method.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">3. Payouts &amp; Settlement</h3>
                  <p>Seller payouts are processed after the buyer confirms delivery or the return window expires (7 days from delivery). Cash-on-delivery orders are settled once Eravenda confirms receipt of payment. Payouts are made to your registered mobile money or bank account within 3 business days.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">3. Product Listings &amp; Accuracy</h3>
                  <p>All product listings must accurately describe the item, including condition, specifications, and pricing. Misleading descriptions, counterfeit goods, or prohibited items will be removed and may result in store suspension. You are responsible for maintaining accurate stock levels.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">4. Order Fulfillment</h3>
                  <p>You agree to process and ship orders within the timeframe stated in your store policy. Orders not fulfilled within 7 days may be auto-cancelled. Repeated late shipments or cancellations affect your store rating and may lead to suspension.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">5. Returns &amp; Disputes</h3>
                  <p>Buyers may request returns within 7 days of delivery for defective or misrepresented items. Eravenda facilitates dispute resolution and may issue refunds at its discretion. Sellers are expected to cooperate in good faith during disputes.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">6. Store Suspension &amp; Termination</h3>
                  <p>Eravenda may suspend or terminate your store for policy violations, fraudulent activity, consistently poor ratings, or prolonged inactivity. Upon termination, pending orders must still be fulfilled or refunded. You may close your store voluntarily by contacting support.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">7. Seller Responsibilities</h3>
                  <p>You are responsible for product quality, accurate descriptions, pricing, packaging, applicable taxes, and compliance with Ghanaian trade regulations. Eravenda acts as a marketplace intermediary and is not liable for product defects or seller conduct.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">8. Governing Law</h3>
                  <p>These terms are governed by the laws of the Republic of Ghana. Disputes are subject to the jurisdiction of the courts of Accra.</p>
                </div>
              </div>
            </details>
          </div>

          <label class="flex gap-3 text-sm text-slate-600 mt-4">
            <input id="storeTermsAccepted" type="checkbox" required class="mt-1">
            <span>I have read and agree to the <strong>Eravenda Seller Terms &amp; Conditions</strong>. I understand the commission policy, payouts follow the settlement schedule, and I am responsible for product accuracy, order fulfillment and applicable taxes.</span>
          </label>

          <button type="submit" class="bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">Submit for review</button>
        </form>
      </div>
    `;
    initLocationSelects(document.getElementById("storeForm"));

    document.getElementById("storeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("storeError");
      errBox.classList.add("hidden");
      const payload = Object.fromEntries(new FormData(e.target).entries());
      try {
        await apiFetch("/stores", { method: "POST", body: payload });
        load();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
      }
    });
  }

  async function renderStoreDashboard(store) {
    const content = document.getElementById("dashContent");

    let products = [];
    let orders = [];
    try { products = await apiFetch("/products/store/mine"); } catch {}
    try { orders = await apiFetch("/orders/store/mine"); } catch {}

    const revenue = orders
      .filter(o => o.status !== "cancelled")
      .reduce((sum, o) => sum + Number(o.subtotal) - Number(o.commission_amount), 0);

    const statusNote = {
      pending: "Your store is awaiting admin approval. You can add products once it's approved.",
      rejected: `Your store application was rejected. ${escapeHtml(store.rejection_reason || "")}`,
      suspended: "Your store has been suspended. Contact support for details.",
    }[store.status];

    const lowStock = products.filter(product => Number(product.stock_quantity) < 5);
    content.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1 mb-1">
        <h1 class="font-head text-2xl font-semibold break-words min-w-0">${escapeHtml(store.store_name)}</h1>
        ${badgeHtml(store.status)}
      </div>
          <p class="text-slate-500 mb-6">Product commission follows the flat launch rate shown in your seller terms.</p>

      ${statusNote ? `<div class="text-sm text-amber-800 bg-amber-50 border border-amber-100 rounded-md p-3 mb-6 break-words">${statusNote}</div>` : ""}

      <div class="border border-slate-200 rounded-md p-5 mb-6">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold">Store info</h3>
          <button type="button" id="storeInfoEditToggle" class="text-sm font-semibold text-brand-600 hover:underline">Edit</button>
        </div>

        <div id="storeInfoView" class="flex flex-wrap sm:flex-nowrap items-start gap-4">
          <img src="${escapeHtml(store.logo_url || "")}" alt="" class="w-14 h-14 rounded-md object-cover border border-slate-200 shrink-0 ${store.logo_url ? "" : "hidden"}">
          <div class="text-sm text-slate-600 space-y-1 min-w-0 break-words">
            <p class="font-medium text-slate-800">${escapeHtml(store.store_name)}</p>
            <p>${escapeHtml(store.description || "No description yet.")}</p>
            <p class="text-slate-500">${[store.sub_town, store.city, store.region].filter(Boolean).map(escapeHtml).join(", ") || "No location set."}</p>
            ${store.business_registration_number ? `<p class="text-slate-500">Reg. no: ${escapeHtml(store.business_registration_number)}</p>` : ""}
          </div>
        </div>

        <form id="storeInfoForm" class="hidden mt-1 space-y-3">
          <div id="storeInfoError" class="hidden text-sm text-red-600 bg-red-50 rounded-md p-3"></div>
          <div id="storeInfoSuccess" class="hidden text-sm text-brand-700 bg-brand-50 rounded-md p-3"></div>
          <div>
            <label class="block text-xs font-medium mb-1">Store name</label>
            <input name="store_name" value="${escapeHtml(store.store_name)}" required class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">Description</label>
            <textarea name="description" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">${escapeHtml(store.description || "")}</textarea>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium mb-1">Region</label>
              <select name="region" data-region-select data-location-group="store-edit" data-selected="${escapeHtml(store.region || "")}" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"><option value="">Select region</option></select>
            </div>
            <div>
              <label class="block text-xs font-medium mb-1">City / District</label>
              <select name="city" data-city-select data-location-group="store-edit" data-selected="${escapeHtml(store.city || "")}" disabled class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"><option value="">Select city / district</option></select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">Sub-town / neighbourhood</label>
            <input name="sub_town" value="${escapeHtml(store.sub_town || "")}" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">Business registration number</label>
            <input name="business_registration_number" value="${escapeHtml(store.business_registration_number || "")}" class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">Store logo</label>
            <div class="flex flex-wrap items-center gap-3">
              <img id="storeLogoPreview" src="${escapeHtml(store.logo_url || "")}" class="w-14 h-14 rounded-md object-cover border border-slate-200 shrink-0 ${store.logo_url ? "" : "hidden"}">
              <input type="file" id="storeLogoFile" accept="image/*" class="text-sm min-w-0 max-w-full">
            </div>
            <input type="hidden" name="logo_url" id="storeLogoUrl" value="${escapeHtml(store.logo_url || "")}">
            <p class="text-xs text-slate-500 mt-1 break-words" id="storeLogoHint"></p>
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">Store banner</label>
            <div class="flex flex-wrap items-center gap-3">
              <img id="storeBannerPreview" src="${escapeHtml(store.banner_url || "")}" class="w-24 h-14 rounded-md object-cover border border-slate-200 shrink-0 ${store.banner_url ? "" : "hidden"}">
              <input type="file" id="storeBannerFile" accept="image/*" class="text-sm min-w-0 max-w-full">
            </div>
            <input type="hidden" name="banner_url" id="storeBannerUrl" value="${escapeHtml(store.banner_url || "")}">
            <p class="text-xs text-slate-500 mt-1 break-words" id="storeBannerHint"></p>
          </div>
          <div class="flex flex-wrap gap-2 pt-1">
            <button type="submit" class="bg-brand-500 hover:bg-brand-600 text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">Save store info</button>
            <button type="button" id="storeInfoCancel" class="border border-slate-300 text-sm font-semibold px-4 py-2 rounded-md hover:bg-slate-50">Cancel</button>
          </div>
        </form>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
        <div class="border border-slate-200 rounded-md p-4 min-w-0">
          <div class="font-head text-xl sm:text-2xl font-bold truncate">${products.length}</div>
          <div class="text-xs text-slate-500">Products listed</div>
        </div>
        <div class="border border-slate-200 rounded-md p-4 min-w-0">
          <div class="font-head text-xl sm:text-2xl font-bold truncate">${orders.length}</div>
          <div class="text-xs text-slate-500">Total orders</div>
        </div>
        <div class="border border-slate-200 rounded-md p-4 min-w-0">
          <div class="font-head text-xl sm:text-2xl font-bold truncate">${money(revenue)}</div>
          <div class="text-xs text-slate-500">Net earnings so far</div>
        </div>
      </div>

      ${lowStock.length ? `<div class="border border-amber-200 bg-amber-50 rounded-md p-4 mb-6">
        <div class="flex flex-wrap items-center gap-2"><span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-200 text-amber-900 whitespace-nowrap">Low Stock: Less than 5 remaining</span><span class="text-sm text-amber-900">${lowStock.length} product${lowStock.length === 1 ? " needs" : "s need"} attention.</span></div>
        <div class="mt-2 text-sm text-amber-800 break-words">${lowStock.map(product => `${escapeHtml(product.name)} (${product.stock_quantity})`).join(" · ")}</div>
      </div>` : ""}

      <div class="border border-slate-200 rounded-md p-5">
        <h3 class="font-semibold mb-3">Recent orders</h3>
        ${orders.length ? `
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead><tr class="text-left text-xs text-slate-500 uppercase"><th class="pb-2">Order</th><th class="pb-2">Status</th><th class="pb-2">Total</th></tr></thead>
              <tbody>
                ${orders.slice(0, 5).map(o => `
                  <tr class="border-t border-slate-100">
                    <td class="py-2">${escapeHtml(o.order_number)}</td>
                    <td class="py-2">${badgeHtml(o.status)}</td>
                    <td class="py-2">${money(o.total_amount)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>` : `<p class="text-slate-500 text-sm">No orders yet.</p>`}
      </div>
    `;
    initLocationSelects(document.getElementById("storeInfoForm"));
    wireStoreInfoForm(store);
  }

  function wireStoreInfoForm(store) {
    const view = document.getElementById("storeInfoView");
    const form = document.getElementById("storeInfoForm");
    const editToggle = document.getElementById("storeInfoEditToggle");
    const cancelBtn = document.getElementById("storeInfoCancel");
    const errBox = document.getElementById("storeInfoError");
    const okBox = document.getElementById("storeInfoSuccess");

    editToggle.addEventListener("click", () => {
      view.classList.add("hidden");
      form.classList.remove("hidden");
    });
    cancelBtn.addEventListener("click", () => {
      form.classList.add("hidden");
      view.classList.remove("hidden");
      errBox.classList.add("hidden");
      okBox.classList.add("hidden");
    });

    wireImageUploadField("storeLogoFile", "storeLogoUrl", "storeLogoPreview", "storeLogoHint");
    wireImageUploadField("storeBannerFile", "storeBannerUrl", "storeBannerPreview", "storeBannerHint");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.add("hidden");
      okBox.classList.add("hidden");
      const fd = new FormData(form);
      const payload = {
        store_name: fd.get("store_name"),
        description: fd.get("description") || null,
        region: fd.get("region") || null,
        city: fd.get("city") || null,
        sub_town: fd.get("sub_town") || null,
        business_registration_number: fd.get("business_registration_number") || null,
        logo_url: fd.get("logo_url") || null,
        banner_url: fd.get("banner_url") || null,
      };
      try {
        const updated = await apiFetch("/stores/me", { method: "PUT", body: payload });
        okBox.textContent = "Store info updated.";
        okBox.classList.remove("hidden");
        renderStoreDashboard(updated);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
      }
    });
  }

  async function uploadToCloudinary(file) {
    const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`;
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(url, { method: "POST", body: fd });
    if (!res.ok) throw new Error("Image upload failed");
    const data = await res.json();
    return data.secure_url;
  }

  function wireImageUploadField(fileInputId, hiddenInputId, previewId, hintId) {
    const fileInput = document.getElementById(fileInputId);
    const hiddenInput = document.getElementById(hiddenInputId);
    const preview = document.getElementById(previewId);
    const hint = document.getElementById(hintId);
    if (!fileInput) return;
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET) {
        hint.textContent = "Image uploads aren't configured yet — set CLOUDINARY_CLOUD_NAME and CLOUDINARY_UPLOAD_PRESET in static/js/config.js.";
        return;
      }
      hint.textContent = "Uploading…";
      try {
        const url = await uploadToCloudinary(file);
        hiddenInput.value = url;
        preview.src = url;
        preview.classList.remove("hidden");
        hint.textContent = "";
      } catch (err) {
        hint.textContent = err.message;
      }
    });
  }

  load();
</script>
{% endblock %}
