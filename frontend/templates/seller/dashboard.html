{% extends "base.html" %}
{% block title %}Seller dashboard — Eravenda Market{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-8 grid md:grid-cols-[200px_1fr] gap-8">
  {% set active = "overview" %}
  {% include "components/seller-nav.html" with context %}

  <div id="dashContent">
    <p class="text-slate-500">Loading your store…</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  if (!Auth.isLoggedIn()) {
    window.location.href = "/login?next=/seller/dashboard.html";
  }

  function money(n) { return `₵${Number(n).toFixed(2)}`; }
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  const STATUS_STYLES = {
    pending: "bg-amber-50 text-amber-700",
    approved: "bg-brand-50 text-brand-700",
    rejected: "bg-red-50 text-red-700",
    suspended: "bg-red-50 text-red-700",
    paid: "bg-brand-50 text-brand-700",
    processing: "bg-blue-50 text-blue-700",
    shipped: "bg-blue-50 text-blue-700",
    delivered: "bg-brand-50 text-brand-700",
    cancelled: "bg-red-50 text-red-700",
  };
  function badgeHtml(status) {
    const classes = STATUS_STYLES[status] || "bg-slate-100 text-slate-600";
    return `<span class="text-xs font-semibold px-2 py-0.5 rounded-full capitalize ${classes}">${status}</span>`;
  }

  async function load() {
    try {
      const store = await apiFetch("/stores/me");
      renderStoreDashboard(store);
    } catch (err) {
      // No store yet — show the setup form instead.
      renderSetupForm();
    }
  }

  function renderSetupForm() {
    const user = Auth.getUser() || {};
    document.getElementById("dashContent").innerHTML = `
      <h1 class="font-head text-2xl font-semibold mb-2">Open your store</h1>
      <p class="text-slate-500 mb-4">Tell us about your business. An admin reviews every new store before it goes live, usually within a day.</p>
      <div class="border border-slate-200 rounded-md p-6 max-w-lg">
        <div id="storeError" class="hidden text-sm text-red-600 bg-red-50 rounded-md p-3 mb-4"></div>
        <form id="storeForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Store name</label>
            <input name="store_name" required class="w-full border border-slate-300 rounded-md px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Description</label>
            <textarea name="description" placeholder="What do you sell?" class="w-full border border-slate-300 rounded-md px-3 py-2"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm font-medium mb-1">Region</label>
              <select name="region" required data-region-select data-location-group="store" data-selected="${escapeHtml(user.region || "")}" class="w-full border border-slate-300 rounded-md px-3 py-2"><option value="">Select region</option></select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">City / District</label>
              <select name="city" required data-city-select data-location-group="store" data-selected="${escapeHtml(user.city || "")}" disabled class="w-full border border-slate-300 rounded-md px-3 py-2"><option value="">Select city / district</option></select>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Sub-town / neighbourhood</label>
            <input name="sub_town" required value="${escapeHtml(user.sub_town || "")}" placeholder="e.g. Fiapre" class="w-full border border-slate-300 rounded-md px-3 py-2">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Business registration number (optional)</label>
            <input name="business_registration_number" class="w-full border border-slate-300 rounded-md px-3 py-2">
          </div>
          <div class="border-t border-slate-200 pt-4 mt-2">
            <details class="group">
              <summary class="cursor-pointer text-sm font-semibold text-slate-700 hover:text-brand-700">Read the Seller Terms &amp; Conditions</summary>
              <div class="mt-3 bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4 text-sm text-slate-700 leading-relaxed max-h-64 overflow-y-auto">

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">1. Seller Commission</h3>
                  <p>Eravenda charges a <strong>tiered commission</strong> based on the price of each product sold. The commission is deducted automatically before your payout:</p>
                  <ul class="list-disc pl-5 mt-2 space-y-1">
                    <li><strong>3%</strong> for products priced below GHS 1,000</li>
                    <li><strong>4%</strong> for products priced GHS 1,000 – 10,000</li>
                    <li><strong>5%</strong> for products priced above GHS 10,000</li>
                  </ul>
                  <p class="mt-2">The commission covers payment processing, platform operations, buyer support and marketing. Commission rates may be adjusted with 30 days' notice.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">2. Payouts &amp; Settlement</h3>
                  <p>Seller payouts are processed after the buyer confirms delivery or the return window expires (7 days from delivery). Cash-on-delivery orders are settled once Eravenda confirms receipt of payment. Payouts are made to your registered mobile money or bank account within 3 business days.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">3. Product Listings &amp; Accuracy</h3>
                  <p>All product listings must accurately describe the item, including condition, specifications, and pricing. Misleading descriptions, counterfeit goods, or prohibited items will be removed and may result in store suspension. You are responsible for maintaining accurate stock levels.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">4. Order Fulfillment</h3>
                  <p>You agree to process and ship orders within the timeframe stated in your store policy. Orders not fulfilled within 7 days may be auto-cancelled. Repeated late shipments or cancellations affect your store rating and may lead to suspension.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">5. Returns &amp; Disputes</h3>
                  <p>Buyers may request returns within 7 days of delivery for defective or misrepresented items. Eravenda facilitates dispute resolution and may issue refunds at its discretion. Sellers are expected to cooperate in good faith during disputes.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">6. Store Suspension &amp; Termination</h3>
                  <p>Eravenda may suspend or terminate your store for policy violations, fraudulent activity, consistently poor ratings, or prolonged inactivity. Upon termination, pending orders must still be fulfilled or refunded. You may close your store voluntarily by contacting support.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">7. Seller Responsibilities</h3>
                  <p>You are responsible for product quality, accurate descriptions, pricing, packaging, applicable taxes, and compliance with Ghanaian trade regulations. Eravenda acts as a marketplace intermediary and is not liable for product defects or seller conduct.</p>
                </div>

                <div>
                  <h3 class="font-semibold text-slate-900 mb-1">8. Governing Law</h3>
                  <p>These terms are governed by the laws of the Republic of Ghana. Disputes are subject to the jurisdiction of the courts of Accra.</p>
                </div>
              </div>
            </details>
          </div>

          <label class="flex gap-3 text-sm text-slate-600 mt-4">
            <input id="storeTermsAccepted" type="checkbox" required class="mt-1">
            <span>I have read and agree to the <strong>Eravenda Seller Terms &amp; Conditions</strong>. I understand that commission is tiered by product price (3% under GHS 1,000, 4% for GHS 1,000–10,000, 5% above GHS 10,000), payouts follow the settlement schedule, and I am responsible for product accuracy, order fulfillment and applicable taxes.</span>
          </label>

          <button type="submit" class="bg-brand-500 hover:bg-brand-600 text-white font-semibold px-5 py-2 rounded-md transition-colors">Submit for review</button>
        </form>
      </div>
    `;
    initLocationSelects(document.getElementById("storeForm"));

    document.getElementById("storeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("storeError");
      errBox.classList.add("hidden");
      const payload = Object.fromEntries(new FormData(e.target).entries());
      try {
        await apiFetch("/stores", { method: "POST", body: payload });
        load();
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
      }
    });
  }

  async function renderStoreDashboard(store) {
    const content = document.getElementById("dashContent");

    let products = [];
    let orders = [];
    try { products = await apiFetch("/products/store/mine"); } catch {}
    try { orders = await apiFetch("/orders/store/mine"); } catch {}

    const revenue = orders
      .filter(o => o.status !== "cancelled")
      .reduce((sum, o) => sum + Number(o.subtotal) - Number(o.commission_amount), 0);

    const statusNote = {
      pending: "Your store is awaiting admin approval. You can add products once it's approved.",
      rejected: `Your store application was rejected. ${escapeHtml(store.rejection_reason || "")}`,
      suspended: "Your store has been suspended. Contact support for details.",
    }[store.status];

    const lowStock = products.filter(product => Number(product.stock_quantity) < 5);
    content.innerHTML = `
      <div class="flex items-center justify-between mb-1">
        <h1 class="font-head text-2xl font-semibold">${escapeHtml(store.store_name)}</h1>
        ${badgeHtml(store.status)}
      </div>
      <p class="text-slate-500 mb-6">Platform commission is automatically tiered by each product’s price.</p>

      ${statusNote ? `<div class="text-sm text-amber-800 bg-amber-50 border border-amber-100 rounded-md p-3 mb-6">${statusNote}</div>` : ""}

      <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
        <div class="border border-slate-200 rounded-md p-4">
          <div class="font-head text-2xl font-bold">${products.length}</div>
          <div class="text-xs text-slate-500">Products listed</div>
        </div>
        <div class="border border-slate-200 rounded-md p-4">
          <div class="font-head text-2xl font-bold">${orders.length}</div>
          <div class="text-xs text-slate-500">Total orders</div>
        </div>
        <div class="border border-slate-200 rounded-md p-4">
          <div class="font-head text-2xl font-bold">${money(revenue)}</div>
          <div class="text-xs text-slate-500">Net earnings so far</div>
        </div>
      </div>

      ${lowStock.length ? `<div class="border border-amber-200 bg-amber-50 rounded-md p-4 mb-6">
        <div class="flex items-center gap-2"><span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-200 text-amber-900">Low Stock: Less than 5 remaining</span><span class="text-sm text-amber-900">${lowStock.length} product${lowStock.length === 1 ? " needs" : "s need"} attention.</span></div>
        <div class="mt-2 text-sm text-amber-800">${lowStock.map(product => `${escapeHtml(product.name)} (${product.stock_quantity})`).join(" · ")}</div>
      </div>` : ""}

      <div class="border border-slate-200 rounded-md p-5">
        <h3 class="font-semibold mb-3">Recent orders</h3>
        ${orders.length ? `
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-slate-500 uppercase"><th class="pb-2">Order</th><th class="pb-2">Status</th><th class="pb-2">Total</th></tr></thead>
            <tbody>
              ${orders.slice(0, 5).map(o => `
                <tr class="border-t border-slate-100">
                  <td class="py-2">${escapeHtml(o.order_number)}</td>
                  <td class="py-2">${badgeHtml(o.status)}</td>
                  <td class="py-2">${money(o.total_amount)}</td>
                </tr>`).join("")}
            </tbody>
          </table>` : `<p class="text-slate-500 text-sm">No orders yet.</p>`}
      </div>
    `;
  }

  load();
</script>
{% endblock %}
